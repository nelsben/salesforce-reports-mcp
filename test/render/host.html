<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test host</title>
<style>
  :root { color-scheme: light; --page: #f5f5f4; --surface: #ffffff; --line: #d6d3d1; --ink: #292524; --ink-2: #78716c; }
  body[data-theme="dark"] { color-scheme: dark; --page: #1c1b1a; --surface: #262524; --line: #44403c; --ink: #e7e5e4; --ink-2: #a8a29e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--page); color: var(--ink); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .bar { padding: 8px 16px; border-bottom: 1px solid var(--line); color: var(--ink-2); font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; }
  #stage { padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  #prompt { align-self: center; width: 100%; max-width: 720px; margin: 0; text-align: right; }
  #prompt span { display: inline-block; padding: 8px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
  #frame-box { width: 720px; max-width: 100%; }
  #frame-box iframe { display: block; width: 100%; height: 120px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
</style>
</head>
<body data-theme="light">
<header class="bar">Test host</header>
<main id="stage">
  <p id="prompt" hidden><span></span></p>
  <div id="frame-box"></div>
</main>
<script src="host.js"></script>
</body>
</html>
